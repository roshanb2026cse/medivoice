 <!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MediVoice</title>
<style>
:root{--bg:#F8FAFC;--card:#fff;--tx:#0F172A;--tx2:#64748B;--pri:#2563EB;--teal:#0F766E;--ok:#15803D;--warn:#B45309;--err:#B91C1C;--bd:#E2E8F0;--fs:17px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0B1220;--card:#131C2E;--tx:#F1F5F9;--tx2:#94A3B8;--pri:#60A5FA;--teal:#2DD4BF;--ok:#4ADE80;--warn:#FBBF24;--err:#F87171;--bd:#263148}}
:root[data-theme=dark]{--bg:#0B1220;--card:#131C2E;--tx:#F1F5F9;--tx2:#94A3B8;--pri:#60A5FA;--teal:#2DD4BF;--ok:#4ADE80;--warn:#FBBF24;--err:#F87171;--bd:#263148}
.hc{--bd:currentColor;--tx2:var(--tx)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:400 var(--fs)/1.5 Rubik,system-ui,sans-serif;background:var(--bg);color:var(--tx)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.logo{font-weight:700;font-size:1.3em;color:var(--pri)}.logo small{display:block;font-weight:400;font-size:.55em;color:var(--tx2)}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--bd)}
nav a,button,select,input{font:inherit;color:inherit}
nav a{white-space:nowrap;padding:12px 14px;border-radius:10px;text-decoration:none;color:var(--tx2);font-weight:500;min-height:48px;display:flex;align-items:center}
nav a.on{background:var(--pri);color:#fff}
main{max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:1.6em;margin:.2em 0 .6em}h2{font-size:1.15em;margin:0 0 .6em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.stat b{display:block;font-size:2em}.stat span{color:var(--tx2)}
button{min-height:48px;padding:10px 18px;border-radius:12px;border:2px solid var(--pri);background:var(--card);cursor:pointer;font-weight:600}
.p{background:var(--pri);color:#fff}.t{background:var(--teal);border-color:var(--teal);color:#fff}.d{border-color:var(--err);color:var(--err)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
input,select{width:100%;min-height:48px;padding:10px;border:2px solid var(--bd);border-radius:10px;background:var(--bg)}
label{display:block;font-weight:500;margin:10px 0 4px}.err{color:var(--err);font-size:.9em}
:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.8em;font-weight:600;border:1px solid currentColor}
.s-confirmed{color:var(--ok)}.s-missed{color:var(--err)}.s-due,.s-snoozed{color:var(--warn)}.s-upcoming{color:var(--tx2)}
.item{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--bd)}
.warn{border-left:6px solid var(--warn)}
.bars{display:flex;gap:8px;align-items:flex-end;height:120px}.bars div{flex:1;text-align:center;font-size:.75em}.bars i{display:block;background:var(--teal);border-radius:6px 6px 0 0;min-height:2px}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 20px;border-radius:12px;z-index:30;display:none}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
#modal>div{background:var(--card);border-radius:18px;padding:20px;max-width:480px;width:100%;max-height:90vh;overflow-y:auto}
#login{position:fixed;inset:0;background:var(--bg);z-index:40;display:none;align-items:center;justify-content:center;padding:16px;overflow-y:auto}#login>div{max-width:420px;width:100%;margin:auto}
.tabs{display:flex;gap:8px;margin-top:10px}.tabs button{flex:1;padding:10px 6px}
a.btn{text-decoration:none;display:inline-flex;align-items:center;min-height:48px;padding:10px 18px;border-radius:12px;border:2px solid var(--pri);font-weight:600;color:var(--pri)}
.demo{background:var(--warn);color:#fff;padding:2px 10px;border-radius:99px;font-size:.75em;font-weight:600}.sim{border:2px dashed var(--warn)}
</style></head><body>
<header id="hd" style="display:none"><div class="logo">💊 MediVoice<small id="who"></small></div>
<div class="row"><select id="lang" aria-label="Language" style="width:auto"><option value="en">English</option><option value="ta">தமிழ்</option></select><button id="lo" style="min-height:40px;padding:4px 12px"></button></div></header>
<nav id="nav" aria-label="Main"></nav>
<main id="app"></main><div id="toast" role="status"></div>
<div id="modal" role="dialog" aria-modal="true"><div id="mb"></div></div>
<div id="cam" role="dialog" aria-modal="true" aria-label="Camera" style="display:none;position:fixed;inset:0;z-index:50;background:#000;flex-direction:column;padding-top:env(safe-area-inset-top,0px)"><video id="camv" playsinline muted autoplay style="flex:1;min-height:0;width:100%;object-fit:cover"></video><div class="row" style="justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#000"><button class="p" id="camsnap" style="min-height:60px;font-size:1.15em">📸 Capture</button><button id="camx" style="color:#fff">Cancel</button></div></div>
<div id="login" role="dialog" aria-modal="true" aria-label="Log in"></div>
<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0'),K='medivoice.site1';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),hm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
let S=null;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!Array.isArray(S.accts))S={accts:[],sess:null,data:{},set:{size:17,hc:false,lang:'en',rate:.9}};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(DB?{sess:S.sess,set:S.set,accts:[],data:{}}:S))}catch(e){}const u=me();if(DB&&u&&u.role==='user')DB.collection('data').doc(ek(u.email)).set(cl(D(u.email))).catch(()=>toast('Could not save to the shared database.'))};
const hp=async p=>{try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('mv:'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return'p:'+btoa(unescape(encodeURIComponent(p)))}};
let DB=null;const ek=e=>String(e).replace(/[^a-z0-9_.@+-]/g,'_'),cl=o=>JSON.parse(JSON.stringify(o));
const me=()=>S.accts.find(a=>a.email===S.sess),D=e=>S.data[ek(e)]||(S.data[ek(e)]={meds:[],ev:{},log:[]});
/* Shared database: every signed-in group member sees the same accounts and data */
const pa=a=>{if(DB)DB.collection('accts').doc(ek(a.email)).set(cl(a)).catch(()=>toast('Could not save to the shared database.'))},da=e=>{if(DB)DB.collection('accts').doc(ek(e)).delete().catch(()=>{})};
async function seedAdmin(){if(S.accts.some(a=>a.role==='admin'))return;const a={email:'admin@medivoice.demo',name:'Administrator',role:'admin',phone:'',h:await hp('Admin@123')};S.accts.push(a);pa(a)}
function initDb(){return new Promise(async ok=>{const to=setTimeout(ok,8000);try{DB=window.claude?await claude.use('db'):null}catch(e){DB=null}if(!DB){clearTimeout(to);return ok()}let first=1;
DB.collection('data').onSnapshot(sn=>{const m={};sn.docs.forEach(d=>{m[d.id]=cl(d.data()||{meds:[],ev:{},log:[]})});S.data=m;if(!first)render()},()=>{});
DB.collection('accts').onSnapshot(async sn=>{S.accts=sn.docs.map(d=>d.data()&&cl(d.data())).filter(Boolean);if(first){if(sn.metadata.fromCache)return;first=0;clearTimeout(to);await seedAdmin();ok()}else{if(S.sess&&!me())S.sess=null;render()}},()=>{clearTimeout(to);ok()})})}
const ROLES={user:'Patient / User',care:'Caregiver',admin:'Admin'},SH={user:'User',care:'Caregiver',admin:'Admin'};
const TT={en:{today:'Today',meds:'Medicines',report:'Reports',set:'Settings',pts:'Patients',admin:'Admin Panel',taken:'I’ve taken it',later:'Remind me later',alert:'Alert caregiver',test:'Test voice reminder',out:'Log out',msg:'Hello. It is time to check your scheduled medicine. Please verify the medicine name and follow your prescription. Have you completed this reminder?',confirmed:'Confirmed',missed:'Missed',snoozed:'Snoozed',upcoming:'Upcoming',due:'Due',chk:'Medicine Check',rem:'Reminders',rx:'Scan Prescription'},
ta:{today:'இன்று',meds:'மருந்துகள்',report:'அறிக்கைகள்',set:'அமைப்புகள்',pts:'நோயாளிகள்',admin:'நிர்வாகி பக்கம்',taken:'எடுத்துக்கொண்டேன்',later:'பிறகு நினைவூட்டு',alert:'பராமரிப்பாளரை எச்சரி',test:'குரல் நினைவூட்டலைச் சோதி',out:'வெளியேறு',msg:'வணக்கம். உங்கள் மருந்து எடுக்கும் நேரம் இது. மருந்தின் பெயரையும் மருந்துச்சீட்டையும் சரிபார்க்கவும். இந்த நினைவூட்டலை முடித்துவிட்டீர்களா?',confirmed:'உறுதிசெய்தது',missed:'தவறியது',snoozed:'தள்ளிவைக்கப்பட்டது',upcoming:'வரவிருக்கிறது',due:'நேரம் வந்தது',chk:'மருந்து சரிபார்ப்பு',rem:'நினைவூட்டல்கள்',rx:'மருந்துச்சீட்டு ஸ்கேன்'}};
const t=k=>(TT[S.set.lang]||TT.en)[k]||TT.en[k]||k;
function toast(m){const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3000)}
/* events are generated from medicines; only confirm/snooze actions are stored */
function evs(e,days=0){const out=[],n=new Date();for(let d=days;d>=0;d--){const day=dk(new Date(n-d*864e5));D(e).meds.forEach(m=>{if((m.start&&day<m.start)||(m.end&&day>m.end)||(m.freq==='weekdays'&&[0,6].includes(new Date(n.getFullYear(),n.getMonth(),n.getDate()-d).getDay())))return;m.times.forEach(h=>{const[H,M]=h.split(':').map(Number);out.push({id:m.id+'|'+day+'|'+h,m,e,at:new Date(n.getFullYear(),n.getMonth(),n.getDate()-d,H,M)})})})}return out.sort((a,b)=>a.at-b.at)}
function st(x){const r=D(x.e).ev[x.id],n=Date.now();if(r==='ok')return'confirmed';if(r>0&&n<r)return'snoozed';if(n<x.at)return'upcoming';const g=(S.set.grace||30)*6e4;return n<=+x.at+g||(r>0&&n<r+g)?'due':'missed'}
function rate(l){const el=l.filter(x=>!['snoozed','upcoming'].includes(st(x))),c=el.filter(x=>st(x)==='confirmed').length;return{c,n:el.length,pct:el.length?Math.round(c/el.length*100):null}}
const tag=s=>`<span class="tag s-${s}">${t(s)}</span>`;
function week(e){const l=evs(e,6),o=[];for(let d=6;d>=0;d--){const day=dk(new Date(Date.now()-d*864e5));o.push({day:day.slice(5),pct:rate(l.filter(x=>dk(x.at)===day)).pct})}return o}
const bars=w=>`<div class="bars" role="img" aria-label="Daily confirmation rate">${w.map(x=>`<div><i style="height:${x.pct??0}px"></i>${x.pct==null?'–':x.pct+'%'}<br>${x.day}</div>`).join('')}</div>`;
let AC,ringT;
function beep(){try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume();[0,.25,.5].forEach((o,i)=>{const s=AC.createOscillator(),g=AC.createGain(),T=AC.currentTime+o;s.frequency.value=i==1?1040:880;g.gain.setValueAtTime(.0001,T);g.gain.exponentialRampToValueAtTime(.3,T+.02);g.gain.exponentialRampToValueAtTime(.0001,T+.2);s.connect(g);g.connect(AC.destination);s.start(T);s.stop(T+.22)})}catch(e){}}
const stopRing=()=>{clearInterval(ringT);try{navigator.vibrate&&navigator.vibrate(0)}catch(e){}try{speechSynthesis.cancel()}catch(e){}};
function speak(x){const el=$('#spk');if(el)el.textContent=x;if(!('speechSynthesis' in window))return toast('Voice is not available in this browser. Please read the message on screen.');const ta=S.set.lang==='ta',v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith(ta?'ta':'en'));if(ta&&!v)return toast('No Tamil voice on this device, so the message is shown as text only.');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(x);u.lang=ta?'ta-IN':'en-IN';u.rate=S.set.rate||.9;if(v)u.voice=v;u.onerror=()=>toast('Voice was blocked or failed. Tap Repeat Reminder to hear it.');speechSynthesis.speak(u);setTimeout(()=>{if(!speechSynthesis.speaking&&!speechSynthesis.pending)toast('Voice did not start. Check your device volume.')},1500)}
function ring(x){stopRing();$('#mb').innerHTML=`<h2>⏰ ${esc(x.m.name)}</h2><p>${esc(x.m.dose)}<br>${esc(x.m.ins||'')}<br><b>${hm(x.at)}</b></p><p id="spk" class="card">${esc(t('msg'))}</p><div class="row"><button class="p" data-k="ok" data-id="${esc(x.id)}">${t('taken')}</button><button data-k="later" data-id="${esc(x.id)}">${t('later')}</button><button class="t" data-k="voice" data-id="${esc(x.id)}">🎤 Say “Taken”</button><button data-k="help" data-id="${esc(x.id)}">${t('alert')}</button><button data-k="rep" data-id="${esc(x.id)}">Repeat Reminder</button><button class="p" data-k="openchk" data-id="${esc(x.id)}">📷 Open Medicine Check</button><button data-k="stop">Stop sound</button></div><div id="al"></div>`;$('#modal').style.display='flex';beep();pushN(x);try{navigator.vibrate([400,200,400])}catch(e){}ringT=setInterval(beep,2500);setTimeout(()=>clearInterval(ringT),12e4);speak(vt('rem',x.m.name,x.m.dose,hm(x.at)))}
function act(id,a){const u=me(),d=D(u.email);if(a==='ok'){d.ev[id]='ok';d.log.unshift({at:Date.now(),txt:'Patient confirmed a reminder'});toast('Confirmed. This records your confirmation only.')}else{d.ev[id]=Date.now()+6e5;d.log.unshift({at:Date.now(),txt:'Patient snoozed a reminder for 10 minutes'});toast('Snoozed 10 minutes.')}CHKE=null;stopRing();save();$('#modal').style.display='none';al.delete(id);render()}
function help(id){const u=me(),x=evs(u.email,1).find(e=>e.id===id),num=String(u.phone||'').replace(/\D/g,''),ok=num.length>=10,txt='MediVoice: '+(x?x.m.name+' ('+hm(x.at)+') has not been confirmed. Please check on me.':'A reminder has not been confirmed. Please check on me.');
D(u.email).log.unshift({at:Date.now(),txt:'Patient asked for caregiver help'});save();
if($('#modal').style.display!=='flex'){$('#mb').innerHTML='<h2>Alert caregiver</h2><div id="al"></div>';$('#modal').style.display='flex'}
$('#al').innerHTML=`<div class="card"><p><b>${esc(S.set.cgName||'Caregiver')}</b></p><p style="color:var(--tx2)">${esc(txt)}</p>${ok?'':'<p class="err">No caregiver phone saved. Add it in Settings.</p>'}<div class="row"><a class="btn" href="sms:${ok?'+'+num:''}?&body=${encodeURIComponent(txt)}" target="_blank" rel="noopener noreferrer">✉️ Send SMS</a><a class="btn" href="https://wa.me/${ok?num:''}?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener noreferrer">💬 WhatsApp</a><button data-k="close">Close</button></div><p style="color:var(--tx2)">Your phone opens the message ready to send. Tap Send to deliver it.</p></div>`}
const al=new Set();
function tick(){const u=me();if(u&&u.role==='user'&&$('#modal').style.display!=='flex')for(const x of evs(u.email)){if(st(x)==='due'&&!al.has(x.id)){al.add(x.id);ring(x);return}}const f=document.activeElement;if(!(f&&['INPUT','SELECT'].includes(f.tagName)))render()}
const evRow=(x,b)=>{const s=st(x);return`<div class="item"><div><b>${esc(x.m.name)}</b><br><span style="color:var(--tx2)">${esc(x.m.dose)} · ${hm(x.at)}</span></div><div class="row">${tag(s)}${b&&s!=='confirmed'?`<button class="p" data-k="ok" data-id="${esc(x.id)}">${t('taken')}</button><button data-k="later" data-id="${esc(x.id)}">${t('later')}</button><button class="t" data-k="voice" data-id="${esc(x.id)}">🎤 Say “Taken”</button><button data-k="help" data-id="${esc(x.id)}">${t('alert')}</button>`:''}</div></div>`};
const stats=l=>{const c=s=>l.filter(x=>st(x)===s).length;return`<div class="grid"><div class="card stat"><b>${l.length}</b><span>Scheduled</span></div><div class="card stat"><b class="s-confirmed">${c('confirmed')}</b><span>${t('confirmed')}</span></div><div class="card stat"><b class="s-due">${c('due')+c('upcoming')+c('snoozed')}</b><span>Pending</span></div><div class="card stat"><b class="s-missed">${c('missed')}</b><span>${t('missed')}</span></div></div>`};
const V={
rx(){return`<h1>${t('rx')}</h1>${RXC()}`},
today(){const u=me(),l=evs(u.email),nx=l.find(x=>['upcoming','due','snoozed'].includes(st(x)));return`<h1>${S.set.lang==='ta'?'வணக்கம், ':'Welcome, '}${esc(u.name)}</h1><p style="color:var(--tx2)">${new Date().toLocaleString(S.set.lang==='ta'?'ta-IN':'en-IN',{dateStyle:'full',timeStyle:'short'})}</p>
<div class="row" style="margin-bottom:14px"><button class="p" data-k="test">🔊 ${t('test')}</button><button onclick="location.hash='meds'">＋ ${t('meds')}</button><button class="t" onclick="location.hash='chk'">📷 Start Medicine Check</button><button class="t" data-k="assist">🎙 Voice assistant</button></div><p id="vas" role="status" style="color:var(--tx2)">Tap the microphone and say: next, taken, later, my medicines, or help.</p>${stats(l)}
<div class="card"><h2>Next reminder</h2>${nx?evRow(nx,true):'<p>Nothing pending. Add medicines to get reminders.</p>'}<h2 style="margin-top:14px">Timeline</h2>${l.map(x=>evRow(x,false)).join('')||'<p>No medicines scheduled today.</p>'}</div>
<div class="card"><h2>Weekly confirmation rate</h2>${bars(week(u.email))}</div><div class="card"><h2>Caregiver activity <span class="demo">SIMULATED</span></h2>${D(u.email).log.slice(0,3).map(g=>`<div class="item">${esc(g.txt)}</div>`).join('')||'<p>No activity.</p>'}</div><div class="card"><b>Spoken message</b><p id="spk">${esc(t('msg'))}</p><button data-k="stop">Stop speech</button></div>`},

const rxI=s=>{const w=s.split(/[^a-z\u0B80-\u0BFF]+/),h=(...a)=>a.some(x=>w.includes(x)),ti=(...a)=>a.some(x=>s.includes(x));return h('help','caregiver')||ti('உதவி','பராமரிப்பாளர்')?'help':h('tamil')||ti('தமிழ்')?'ta':h('english')||ti('ஆங்கிலம்')?'en':h('later','snooze','wait','postpone')||ti('பிறகு','அப்புறம்','தள்ளி')?'later':h('taken','take','done','finished','yes','ok','okay')||ti('எடுத்து','எடுத்த','முடித்த','சரி','ஆம்')?'taken':h('next','upcoming')||ti('அடுத்த')?'next':h('list','medicines')||ti('மருந்துகள்','பட்டியல்')?'list':'unk'};
async function aiIntent(s){try{if(!window.claude)return'unk';const m=await claude.use('sample');if(!m)return'unk';const d=await m.json('A patient spoke to a medicine reminder app in English or Tamil: "'+s.replace(/"/g,'')+'". Classify the intent as one of: taken, later, next, list, help, ta, en, unk. Reply with ONLY JSON: {"intent":"..."}',{modelTier:'default',cache:false});const i=d&&d.intent;return['taken','later','next','list','help','ta','en'].includes(i)?i:'unk'}catch(e){return'unk'}}
function runI(i){const u=me(),l=evs(u.email),pend=l.filter(x=>['due','upcoming','snoozed'].includes(st(x))),n=l.find(x=>st(x)==='due')||pend[0],say=m=>{const e=$('#spk');if(e)e.textContent=m;speak(m)};
if(i==='ta'||i==='en'){S.set.lang=i;save();render();return say(vt('lang'))}
if(i==='list')return say(vt('list',D(u.email).meds.map(m=>m.name)));
if(i==='help'){say(vt('help'));return help(n?n.id:'')}
if(!n)return say(vt('none'));
if(i==='next')return say(vt('next',n.m.name,hm(n.at)));
if(i==='taken'){act(n.id,'ok');return say(vt('ok',n.m.name))}
if(i==='later'){act(n.id,'later');return say(vt('later',n.m.name))}
say(vt('unk'))}
function assist(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return toast('Voice reply is not supported on this browser. Please tap a button.');stopRing();const r=new R(),put=m=>{const e=$('#vas');if(e)e.textContent=tr(m)};r.lang=S.set.lang==='ta'?'ta-IN':'en-IN';r.onresult=async x=>{const s=x.results[0][0].transcript.toLowerCase();put('Heard: '+s);let i=rxI(s);if(i==='unk')i=await aiIntent(s);runI(i)};r.onerror=()=>put('Could not hear you. Please try again or tap a button.');put('Listening… say next, taken, later, my medicines, or help');r.start()}
